<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz Questions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ramabhadra&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7; --card: #ffffff; --text: #1a1a1a; --muted: #6b7280;
    --border: #e2e4e9; --accent: #4f46e5; --accent-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16171b; --card: #1f2126; --text: #f0f0f2; --muted: #9aa0ab; --border: #33363f; }
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    max-width: 560px; margin: 0 auto; padding: 1rem 1rem calc(2rem + env(safe-area-inset-bottom, 0px));
    padding-top: calc(1rem + env(safe-area-inset-top, 0px));
    background: var(--bg); color: var(--text);
  }
  h1 { font-size: 1.3rem; margin: 0 0 1rem; display: flex; align-items: center; gap: .5rem; }
  h1 img { height: 2rem; width: auto; border-radius: 6px; }
  .bigLogo { display: block; max-width: 100%; height: auto; margin: .5rem auto 1rem; }
  h2 { font-size: 1rem; margin: 0 0 .75rem; }
  label { display: block; font-size: .85rem; font-weight: 600; color: var(--muted); margin: .6rem 0 .3rem; }
  .screen { display: none; }
  .screen.active { display: block; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1rem; margin-bottom: 1rem; }

  .btn {
    font: inherit; font-weight: 600; padding: .8rem 1.2rem; min-height: 48px;
    border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .btn.full { width: 100%; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn:active:not(:disabled) { transform: scale(.98); }

  textarea {
    width: 100%; min-height: 3.5rem; font: inherit; padding: .6rem; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); resize: vertical;
  }
  textarea.te { font-family: 'Ramabhadra', sans-serif; }

  ul#qList { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: .5rem; }
  ul#qList li { display: flex; align-items: center; gap: .6rem; padding: .5rem .6rem; border: 1px solid var(--border); border-radius: 10px; }
  ul#qList .num { font-weight: 700; color: var(--accent); flex-shrink: 0; }
  ul#qList .preview { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .9rem; color: var(--muted); }
  ul#qList .remove { width: 28px; height: 28px; border-radius: 50%; border: none; background: var(--bg); color: var(--text); cursor: pointer; flex-shrink: 0; }

  .thumb-grid { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: .6rem; padding: 0; margin: 0; }
  .numTile { position: relative; aspect-ratio: 1; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--accent) 10%, var(--card)); border: 1px solid var(--border); }
  .numTile .num { font-size: 2rem; font-weight: 700; color: var(--accent); pointer-events: none; }
  .numTile button.pick { position: absolute; inset: 0; width: 100%; height: 100%; border: none; padding: 0; background: none; cursor: pointer; }

  .back { background: none; border: none; color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; padding: .4rem 0; margin-bottom: .3rem; }

  @media (max-width: 400px) {
    .thumb-grid { grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); }
  }

  /* Display screen: fills the viewport for projection */
  #display-screen.active {
    position: fixed; inset: 0; max-width: none; display: flex; flex-direction: column;
    padding: 4vh 4vw; margin: 0; z-index: 10; background: var(--bg);
  }
  #display-screen .topRow { display: flex; justify-content: space-between; align-items: center; }
  #display-screen .qNum { color: var(--muted); font-weight: 700; font-size: clamp(1rem, 2vw, 1.6rem); }
  #display-screen .content { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 4vh; text-align: center; }
  #display-screen .qText { font-size: clamp(1.8rem, 5.5vw, 5rem); line-height: 1.3; word-break: break-word; }
  #display-screen .qText.te { font-family: 'Ramabhadra', sans-serif; }
  #display-screen .divider { border: none; border-top: 2px solid var(--border); width: 40%; margin: 0 auto; }
</style>
</head>
<body>

<h1><img src="logo.png" alt="MWS logo">MWS Quiz Questions</h1>

<main>
  <section id="manage-screen" class="screen active">
    <div class="card">
      <h2>Add questions</h2>
      <label for="bulkInput">Paste question pairs — English line, then Telugu line, blank line between questions</label>
      <textarea id="bulkInput" placeholder="Sammakka Saralamma Jathara is held in which district?
సమ్మక్క సారలమ్మ జాతర ఏ జిల్లాలో జరుగుతుంది?

Which patriot popularized Ganesh chaturthi celebrations in India?
భారతదేశంలో గణేష్ చతుర్థి వేడుకలను ప్రాచుర్యంలోకి తెచ్చిన దేశభక్తుడు ఎవరు?" style="min-height:8rem"></textarea>
      <button id="addQBtn" class="btn full" style="margin-top:.8rem">Add Question(s)</button>
    </div>

    <div class="card" id="listCard" hidden>
      <div style="display:flex; justify-content:space-between; align-items:center">
        <h2>Your questions (<span id="qCount">0</span>)</h2>
        <button id="clearAllBtn" class="btn" style="min-height:36px; padding:.4rem .8rem">Clear all</button>
      </div>
      <ul id="qList"></ul>
    </div>

    <button id="startBtn" class="btn primary full" disabled>Start Display →</button>
  </section>

  <section id="picker-screen" class="screen">
    <button class="back" data-go="manage-screen">← Manage questions</button>
    <img class="bigLogo" src="logo.png" alt="MWS logo">
    <h2>Choose a question</h2>
    <div id="numberGrid" class="thumb-grid"></div>
  </section>

  <section id="display-screen" class="screen">
    <div class="topRow">
      <button class="back" data-go="picker-screen">← Choose another</button>
      <span class="qNum">Question <span id="qNumber"></span></span>
      <button id="fullscreenBtn" class="btn">⛶ Fullscreen</button>
    </div>
    <div class="content">
      <div class="qText en" id="qTextEn"></div>
      <hr class="divider">
      <div class="qText te" id="qTextTe"></div>
    </div>
  </section>
</main>

<script>
const STORAGE_KEY = 'quizQuestions';
let questions = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(questions)); }

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
}

function renderList() {
  const ul = document.getElementById('qList');
  ul.innerHTML = '';
  questions.forEach((q, i) => {
    const li = document.createElement('li');
    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = i + 1;
    const preview = document.createElement('span');
    preview.className = 'preview';
    preview.textContent = q.en || q.te;
    const rm = document.createElement('button');
    rm.className = 'remove';
    rm.textContent = '×';
    rm.setAttribute('aria-label', 'Remove question');
    rm.onclick = () => { questions.splice(i, 1); save(); renderList(); };
    li.append(num, preview, rm);
    ul.appendChild(li);
  });
  document.getElementById('listCard').hidden = questions.length === 0;
  document.getElementById('qCount').textContent = questions.length;
  document.getElementById('startBtn').disabled = questions.length === 0;
}

const isTelugu = s => /[ఀ-౿]/.test(s);

// Blocks separated by a blank line; each block's non-Telugu line is English,
// its Telugu-script line is Telugu — order-independent so pasted pairs in
// either line order still parse correctly.
function parseBulkQuestions(text) {
  return text.split(/\n\s*\n/).map(block => {
    const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
    if (lines.length === 0) return null;
    const te = lines.find(isTelugu) || '';
    const en = lines.find(l => !isTelugu(l)) || '';
    return (en || te) ? { en, te } : null;
  }).filter(Boolean);
}

document.getElementById('addQBtn').addEventListener('click', () => {
  const box = document.getElementById('bulkInput');
  const parsed = parseBulkQuestions(box.value);
  if (parsed.length === 0) return;
  questions.push(...parsed);
  box.value = '';
  save(); renderList();
});

document.getElementById('clearAllBtn').addEventListener('click', () => {
  if (questions.length && confirm('Remove all questions?')) {
    questions = [];
    save(); renderList();
  }
});

document.getElementById('startBtn').addEventListener('click', () => {
  renderPicker();
  showScreen('picker-screen');
});

function renderPicker() {
  const grid = document.getElementById('numberGrid');
  grid.innerHTML = '';
  questions.forEach((_, i) => {
    const div = document.createElement('div');
    div.className = 'numTile';
    div.innerHTML = `<span class="num">${i + 1}</span><button class="pick" aria-label="Show question ${i + 1}"></button>`;
    div.querySelector('.pick').onclick = () => showQuestion(i);
    grid.appendChild(div);
  });
}

function showQuestion(i) {
  const q = questions[i];
  document.getElementById('qNumber').textContent = i + 1;
  document.getElementById('qTextEn').textContent = q.en;
  document.getElementById('qTextTe').textContent = q.te;
  showScreen('display-screen');
}

document.getElementById('fullscreenBtn').addEventListener('click', () => {
  if (document.fullscreenElement) {
    document.exitFullscreen();
  } else {
    document.documentElement.requestFullscreen().catch(() => {});
  }
});

document.querySelectorAll('.back').forEach(b => {
  b.addEventListener('click', () => {
    const target = b.dataset.go;
    if (target === 'picker-screen') renderPicker();
    showScreen(target);
  });
});

renderList();
</script>
</body>
</html>
