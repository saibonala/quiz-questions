<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz Questions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ramabhadra&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7; --card: #ffffff; --text: #1a1a1a; --muted: #6b7280;
    --border: #e2e4e9; --accent: #4f46e5; --accent-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16171b; --card: #1f2126; --text: #f0f0f2; --muted: #9aa0ab; --border: #33363f; }
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    max-width: 560px; margin: 0 auto; padding: 1rem 1rem calc(2rem + env(safe-area-inset-bottom, 0px));
    padding-top: calc(1rem + env(safe-area-inset-top, 0px));
    background: var(--bg); color: var(--text);
  }
  h1 { font-size: 1.3rem; margin: 0 0 1rem; display: flex; align-items: center; justify-content: center; gap: .5rem; }
  h1 img { height: 2rem; width: auto; border-radius: 6px; }
  .bigLogo { display: block; width: 140px; max-width: 100%; height: auto; margin: .5rem auto 1rem; }
  h2 { font-size: 1rem; margin: 0 0 .75rem; }
  label { display: block; font-size: .85rem; font-weight: 600; color: var(--muted); margin: .6rem 0 .3rem; }
  .screen { display: none; }
  .screen.active { display: block; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1rem; margin-bottom: 1rem; }

  .btn {
    font: inherit; font-weight: 600; padding: .8rem 1.2rem; min-height: 48px;
    border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .btn.full { width: 100%; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn:active:not(:disabled) { transform: scale(.98); }

  textarea {
    width: 100%; min-height: 3.5rem; font: inherit; padding: .6rem; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); resize: vertical;
  }
  textarea.te { font-family: 'Ramabhadra', sans-serif; }
  input[type=file] { width: 100%; font: inherit; }
  .divider { text-align: center; color: var(--muted); font-size: .85rem; margin: .9rem 0; }

  .dropzone {
    display: flex; flex-direction: column; align-items: center; gap: .4rem;
    border: 2px dashed var(--border); border-radius: 12px; padding: 1.8rem 1rem;
    text-align: center; color: var(--muted); cursor: pointer;
  }
  .dropzone.dragover { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .dropzone .dz-icon { font-size: 2rem; }
  .dropzone strong { color: var(--text); }

  .dots { display: flex; justify-content: center; gap: .4rem; margin-bottom: .8rem; }
  .dots span { width: 9px; height: 9px; border-radius: 50%; background: var(--border); }
  .dots span.done { background: var(--accent); }
  .canvasWrap { position: relative; display: block; max-width: 100%; }
  #imageBlock { display: flex; flex-direction: column; align-items: center; }
  #imageBlock[hidden] { display: none; }
  #qCanvas { max-width: 100%; max-height: 65vh; border-radius: 10px; display: block; background: var(--bg); }
  .spinner {
    position: absolute; inset: 0; margin: auto; width: 32px; height: 32px;
    border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  ul#qList { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: .5rem; }
  ul#qList li { display: flex; align-items: center; gap: .6rem; padding: .5rem .6rem; border: 1px solid var(--border); border-radius: 10px; }
  ul#qList .num { font-weight: 700; color: var(--accent); flex-shrink: 0; }
  ul#qList .preview { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .9rem; color: var(--muted); }
  ul#qList .remove { width: 28px; height: 28px; border-radius: 50%; border: none; background: var(--bg); color: var(--text); cursor: pointer; flex-shrink: 0; }

  .wheelWrap { position: relative; width: min(60vw, 560px); aspect-ratio: 1; margin: 1.8rem 0 1.2rem; }
  #wheelCanvas { width: 100%; height: 100%; border-radius: 50%; display: block; box-shadow: 0 4px 20px rgba(0,0,0,.25); transition: transform 4s cubic-bezier(0.17, 0.67, 0.1, 0.99); }
  #wheelCanvas[hidden] { display: none; }
  .wheelPointer { position: absolute; top: -28px; left: 50%; transform: translateX(-50%); font-size: 2.2rem; line-height: 1; color: var(--accent); z-index: 2; filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
  #wheelStatus { text-align: center; color: var(--muted); margin-top: .5rem; }

  .modalOverlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 20;
    display: flex; align-items: center; justify-content: center; padding: 1rem;
  }
  .modalOverlay[hidden] { display: none; }
  .modalCard { background: var(--card); border-radius: 14px; overflow: hidden; width: min(90vw, 420px); box-shadow: 0 10px 40px rgba(0,0,0,.3); }
  .modalHeader { background: var(--accent); color: var(--accent-text); font-weight: 700; padding: 1rem 1.25rem; }
  .modalBody { padding: 2rem 1.25rem; text-align: center; }
  #winnerNumber { font-size: 3rem; font-weight: 700; color: var(--text); }
  .modalFooter { display: flex; justify-content: flex-end; gap: .6rem; padding: 1rem 1.25rem; border-top: 1px solid var(--border); }
  .modalFooter .btn { min-height: 40px; padding: .5rem 1.1rem; }

  .back { background: none; border: none; color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; padding: .4rem 0; margin-bottom: .3rem; }

  /* Picker screen: widen beyond the 560px body cap so the wheel can grow */
  #picker-screen.active {
    width: 100vw; max-width: 100vw; margin-left: calc(-50vw + 50%); box-sizing: border-box;
    padding: 0 4vw;
  }
  .wheelRow { display: flex; align-items: center; justify-content: center; gap: 2rem; flex-wrap: wrap; }
  .sideLogo { width: 240px; max-width: 20vw; min-width: 90px; height: auto; }
  #picker-screen #spinBtn { display: block; width: min(90vw, 320px); margin: 0 auto; }
  #picker-screen #wheelStatus { max-width: 400px; margin-inline: auto; }

  /* Display screen: fills the viewport for projection */
  #display-screen.active {
    position: fixed; inset: 0; max-width: none; display: flex; flex-direction: column;
    padding: 4vh 4vw; margin: 0; z-index: 10; background: var(--bg);
  }
  #display-screen .topRow { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: .5rem; }
  #display-screen .topRow .back { justify-self: start; }
  #display-screen .topRow .qNum { justify-self: center; }
  #display-screen .topRight { justify-self: end; display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; }
  #display-screen .qNum { color: var(--muted); font-weight: 700; font-size: clamp(1rem, 2vw, 1.6rem); text-align: center; }
  #display-screen .qNum .round { display: block; font-size: .75em; opacity: .8; }
  #display-screen .content { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 4vh; text-align: center; overflow: auto; }
  #display-screen .qText { font-size: clamp(1.8rem, 5.5vw, 5rem); line-height: 1.3; word-break: break-word; }
  #display-screen .qText.te { font-family: 'Ramabhadra', sans-serif; }
  #display-screen .divider { border: none; border-top: 2px solid var(--border); width: 40%; margin: 0 auto; }
  #display-screen audio { width: min(90%, 500px); height: 3.5rem; margin: 0 auto; }

  #timerBlock { display: flex; align-items: center; gap: .6rem; }
  #timerBlock[hidden] { display: none; }
  #timerDisplay { font-size: clamp(1.1rem, 2.4vw, 1.8rem); font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); }
  #timerDisplay.zero { color: #dc2626; }
  #timerDisplay.flash { animation: timerFlash .5s ease-in-out 6; }
  @keyframes timerFlash { 0%, 100% { opacity: 1; } 50% { opacity: .15; } }
  .timerControls { display: flex; gap: .3rem; }
  .timerControls .btn { min-height: 36px; padding: .3rem .6rem; }
</style>
</head>
<body>

<h1><img src="logo.png" alt="MWS logo">MWS Quiz Questions</h1>

<main>
  <section id="manage-screen" class="screen active">
    <div class="card">
      <h2>Add questions</h2>
      <label for="roundInput">Round name</label>
      <select id="roundInput" style="width:100%; font:inherit; padding:.6rem; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text)">
        <option value="Phase I - Round 1 - Maths Science">Phase I - Round 1 - Maths Science</option>
        <option value="Phase I - Round 2 - General Knowledge">Phase I - Round 2 - General Knowledge</option>
        <option value="Phase I - Round 3 - Pictorial">Phase I - Round 3 - Pictorial</option>
        <option value="Phase I - Round 4 - Buzzer">Phase I - Round 4 - Buzzer</option>
        <option value="Phase II - Round 1 - Telangana">Phase II - Round 1 - Telangana</option>
        <option value="Phase II - Round 2 - Mythology">Phase II - Round 2 - Mythology</option>
        <option value="Phase II - Round 3 - English">Phase II - Round 3 - English</option>
        <option value="Phase II - Round 4 - Music">Phase II - Round 4 - Music</option>
        <option value="Phase III - Final Round">Phase III - Final Round</option>
      </select>
      <label for="timerInput">Timer (seconds, optional)</label>
      <input type="number" id="timerInput" min="0" placeholder="0 = no timer" style="width:100%; font:inherit; padding:.6rem; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text)">
      <div id="textSection">
        <label for="bulkInput">Paste question pairs — English line, then Telugu line, blank line between questions</label>
        <textarea id="bulkInput" placeholder="Sammakka Saralamma Jathara is held in which district?
సమ్మక్క సారలమ్మ జాతర ఏ జిల్లాలో జరుగుతుంది?

Which patriot popularized Ganesh chaturthi celebrations in India?
భారతదేశంలో గణేష్ చతుర్థి వేడుకలను ప్రాచుర్యంలోకి తెచ్చిన దేశభక్తుడు ఎవరు?" style="min-height:8rem"></textarea>
        <button id="addQBtn" class="btn full" style="margin-top:.8rem">Add Question(s)</button>
      </div>
      <div id="audioSection" hidden>
        <label id="audioDropzone" class="dropzone" for="audioInput">
          <span class="dz-icon">🎵</span>
          <span><strong>Tap to upload</strong> or drag & drop music clips here</span>
          <input type="file" id="audioInput" accept="audio/*" multiple hidden>
        </label>
      </div>
      <div id="imageSection" hidden>
        <label id="dropzone" class="dropzone" for="imageInput">
          <span class="dz-icon">📁</span>
          <span><strong>Tap to upload</strong> or drag & drop images here</span>
          <input type="file" id="imageInput" accept="image/*" multiple hidden>
        </label>
        <div class="divider">— or —</div>
        <label for="imageUrlInput">Image URLs, one per line</label>
        <textarea id="imageUrlInput" placeholder="https://example.com/photo.jpg"></textarea>
        <button id="addImageUrlsBtn" class="btn full" style="margin-top:.6rem">Add Image URL(s)</button>
      </div>
    </div>

    <div class="card" id="listCard" hidden>
      <div style="display:flex; justify-content:space-between; align-items:center">
        <h2>Your questions (<span id="qCount">0</span>)</h2>
        <button id="clearAllBtn" class="btn" style="min-height:36px; padding:.4rem .8rem">Clear all</button>
      </div>
      <ul id="qList"></ul>
    </div>

    <button id="startBtn" class="btn primary full" disabled>Start Display →</button>
  </section>

  <section id="picker-screen" class="screen">
    <button class="back" data-go="manage-screen">← Manage questions</button>
    <h2 style="text-align:center">Spin for a question</h2>
    <div class="wheelRow">
      <img class="sideLogo" src="logo.png" alt="MWS logo">
      <div class="wheelWrap">
        <span class="wheelPointer">▼</span>
        <canvas id="wheelCanvas" width="560" height="560"></canvas>
      </div>
      <img class="sideLogo" src="logo.png" alt="MWS logo">
    </div>
    <button id="spinBtn" class="btn primary full">🎡 Spin</button>
    <p id="wheelStatus"></p>

    <div id="winnerModal" class="modalOverlay" hidden>
      <div class="modalCard">
        <div class="modalHeader">Question Selected!</div>
        <div class="modalBody">
          <div id="winnerNumber"></div>
        </div>
        <div class="modalFooter">
          <button id="winnerCloseBtn" class="btn">Close</button>
          <button id="winnerRemoveBtn" class="btn primary">Remove →</button>
        </div>
      </div>
    </div>
  </section>

  <section id="display-screen" class="screen">
    <div class="topRow">
      <button class="back" data-go="picker-screen">← Choose another</button>
      <span class="qNum"><span id="qRound" class="round"></span>Question <span id="qNumber"></span></span>
      <div class="topRight">
        <div id="timerBlock" hidden>
          <div id="timerDisplay">00:00</div>
          <div class="timerControls">
            <button id="timerToggleBtn" class="btn primary">▶</button>
          </div>
        </div>
        <button id="fullscreenBtn" class="btn" aria-label="Fullscreen">⛶</button>
      </div>
    </div>
    <div class="content">
      <div class="qText en" id="qTextEn"></div>
      <hr class="divider">
      <div class="qText te" id="qTextTe"></div>
      <audio id="qAudio" controls hidden></audio>
      <button id="chooseAnotherBtn" class="btn primary" hidden>Choose another →</button>
      <div id="imageBlock" hidden>
        <div id="qStageDots" class="dots"></div>
        <div class="canvasWrap">
          <canvas id="qCanvas"></canvas>
          <div id="qSpinner" class="spinner" hidden></div>
        </div>
        <button id="imgNextBtn" class="btn primary" style="margin-top:1rem">Next →</button>
      </div>
    </div>
  </section>
</main>

<script>
const STORAGE_KEY = 'quizQuestions';
const IMG_STAGES = [48, 64, 80, null]; // blocks across canvas width; null = full reveal
const IMG_CANVAS_MAX_W = 640;
let questions = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let currentImg = null;
let imgStageIndex = 0;

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(questions)); }

function showScreen(id) {
  if (id !== 'display-screen') {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
}

function renderList() {
  const ul = document.getElementById('qList');
  ul.innerHTML = '';
  questions.forEach((q, i) => {
    const li = document.createElement('li');
    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = i + 1;
    const preview = document.createElement('span');
    preview.className = 'preview';
    preview.textContent = (q.round ? `[${q.round}] ` : '') +
      (q.en || q.te || (q.audio ? `🎵 ${q.audioName}` : '') || (q.image ? `🖼️ ${q.imageName}` : ''));
    const rm = document.createElement('button');
    rm.className = 'remove';
    rm.textContent = '×';
    rm.setAttribute('aria-label', 'Remove question');
    rm.onclick = () => { questions.splice(i, 1); save(); renderList(); };
    li.append(num, preview, rm);
    ul.appendChild(li);
  });
  document.getElementById('listCard').hidden = questions.length === 0;
  document.getElementById('qCount').textContent = questions.length;
  document.getElementById('startBtn').disabled = questions.length === 0;
}

const isTelugu = s => /[ఀ-౿]/.test(s);

// Blocks separated by a blank line; each block's non-Telugu line is English,
// its Telugu-script line is Telugu — order-independent so pasted pairs in
// either line order still parse correctly.
function parseBulkQuestions(text) {
  return text.split(/\n\s*\n/).map(block => {
    const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
    if (lines.length === 0) return null;
    const te = lines.find(isTelugu) || '';
    const en = lines.find(l => !isTelugu(l)) || '';
    return (en || te) ? { en, te } : null;
  }).filter(Boolean);
}

function currentTimer() {
  return parseInt(document.getElementById('timerInput').value, 10) || 0;
}

document.getElementById('addQBtn').addEventListener('click', () => {
  const box = document.getElementById('bulkInput');
  const round = document.getElementById('roundInput').value.trim();
  const timer = currentTimer();
  const parsed = parseBulkQuestions(box.value);
  if (parsed.length === 0) return;
  questions.push(...parsed.map(q => ({ ...q, round, timer })));
  box.value = '';
  save(); renderList();
});

function handleAudioFiles(fileList) {
  const round = document.getElementById('roundInput').value.trim();
  const timer = currentTimer();
  [...fileList].forEach(file => {
    if (!file.type.startsWith('audio/')) return;
    const reader = new FileReader();
    reader.onload = () => {
      questions.push({ en: '', te: '', round, timer, audio: reader.result, audioName: file.name });
      save(); renderList();
    };
    reader.readAsDataURL(file);
  });
}

document.getElementById('audioInput').addEventListener('change', e => {
  handleAudioFiles(e.target.files);
  e.target.value = '';
});

const audioDropzone = document.getElementById('audioDropzone');
['dragenter', 'dragover'].forEach(evt =>
  audioDropzone.addEventListener(evt, e => { e.preventDefault(); audioDropzone.classList.add('dragover'); })
);
['dragleave', 'drop'].forEach(evt =>
  audioDropzone.addEventListener(evt, e => { e.preventDefault(); audioDropzone.classList.remove('dragover'); })
);
audioDropzone.addEventListener('drop', e => handleAudioFiles(e.dataTransfer.files));

function handleImageFiles(fileList) {
  const round = document.getElementById('roundInput').value.trim();
  const timer = currentTimer();
  [...fileList].forEach(file => {
    if (!file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = () => {
      questions.push({ en: '', te: '', round, timer, image: reader.result, imageName: file.name });
      save(); renderList();
    };
    reader.readAsDataURL(file);
  });
}

document.getElementById('imageInput').addEventListener('change', e => {
  handleImageFiles(e.target.files);
  e.target.value = '';
});

const dropzone = document.getElementById('dropzone');
['dragenter', 'dragover'].forEach(evt =>
  dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add('dragover'); })
);
['dragleave', 'drop'].forEach(evt =>
  dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove('dragover'); })
);
dropzone.addEventListener('drop', e => handleImageFiles(e.dataTransfer.files));

document.getElementById('addImageUrlsBtn').addEventListener('click', () => {
  const box = document.getElementById('imageUrlInput');
  const round = document.getElementById('roundInput').value.trim();
  const timer = currentTimer();
  box.value.split('\n').map(l => l.trim()).filter(Boolean).forEach(url => {
    questions.push({ en: '', te: '', round, timer, image: url, imageName: url.split('/').pop() || url });
  });
  box.value = '';
  save(); renderList();
});

document.getElementById('clearAllBtn').addEventListener('click', () => {
  if (questions.length && confirm('Remove all questions?')) {
    questions = [];
    save(); renderList();
  }
});

document.getElementById('startBtn').addEventListener('click', () => {
  renderPicker();
  showScreen('picker-screen');
});

const WHEEL_COLORS = ['#4f46e5', '#7c3aed', '#0ea5e9', '#059669', '#d97706', '#dc2626', '#db2777', '#0891b2'];
let wheelRotation = 0;

function remainingIndices() {
  return questions.map((_, i) => i).filter(i => !questions[i].asked);
}

// One physical wheel per round: segments are the not-yet-asked question
// numbers, so a picked question can't come up again until the round resets.
function drawWheel(indices) {
  const canvas = document.getElementById('wheelCanvas');
  const ctx = canvas.getContext('2d');
  const size = canvas.width;
  const r = size / 2;
  ctx.clearRect(0, 0, size, size);
  const n = indices.length;
  const segAngle = (2 * Math.PI) / n;
  indices.forEach((qIndex, i) => {
    const start = -Math.PI / 2 + i * segAngle;
    const end = start + segAngle;
    ctx.beginPath();
    ctx.moveTo(r, r);
    ctx.arc(r, r, r, start, end);
    ctx.closePath();
    ctx.fillStyle = WHEEL_COLORS[i % WHEEL_COLORS.length];
    ctx.fill();

    ctx.save();
    ctx.translate(r, r);
    ctx.rotate(start + segAngle / 2);
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.max(14, r * 0.12)}px system-ui, sans-serif`;
    ctx.fillText(String(qIndex + 1), r - 12, 0);
    ctx.restore();
  });
}

function renderPicker() {
  const canvas = document.getElementById('wheelCanvas');
  const remaining = remainingIndices();
  const spinBtn = document.getElementById('spinBtn');
  const status = document.getElementById('wheelStatus');

  pendingPick = null;
  document.getElementById('winnerModal').hidden = true;
  spinBtn.disabled = false;

  canvas.style.transition = 'none';
  canvas.style.transform = 'rotate(0deg)';
  wheelRotation = 0;
  requestAnimationFrame(() => { canvas.style.transition = ''; });

  if (remaining.length === 0) {
    canvas.hidden = true;
    spinBtn.hidden = true;
    status.textContent = questions.length ? 'All questions in this round have been asked.' : '';
  } else {
    canvas.hidden = false;
    spinBtn.hidden = false;
    drawWheel(remaining);
    status.textContent = `${remaining.length} question${remaining.length === 1 ? '' : 's'} left`;
  }
}

document.getElementById('spinBtn').addEventListener('click', () => {
  const remaining = remainingIndices();
  if (remaining.length === 0) return;
  const spinBtn = document.getElementById('spinBtn');
  spinBtn.disabled = true;

  const segAngle = 360 / remaining.length;
  const pickPos = Math.floor(Math.random() * remaining.length);
  const qIndex = remaining[pickPos];
  const segCenter = pickPos * segAngle + segAngle / 2;
  const jitter = (Math.random() - 0.5) * segAngle * 0.6;
  const extraSpins = 5 + Math.floor(Math.random() * 2);
  const base = (360 - segCenter + jitter + 360) % 360;
  const target = wheelRotation - (wheelRotation % 360) + extraSpins * 360 + base;

  wheelRotation = target;
  const canvas = document.getElementById('wheelCanvas');
  canvas.style.transform = `rotate(${target}deg)`;

  canvas.addEventListener('transitionend', () => {
    spinBtn.disabled = false;
    showWinnerModal(qIndex);
  }, { once: true });
});

let pendingPick = null;

function showWinnerModal(qIndex) {
  pendingPick = qIndex;
  document.getElementById('winnerNumber').textContent = `Question ${qIndex + 1}`;
  document.getElementById('winnerModal').hidden = false;
}

document.getElementById('winnerCloseBtn').addEventListener('click', () => {
  pendingPick = null;
  document.getElementById('winnerModal').hidden = true;
});

document.getElementById('winnerRemoveBtn').addEventListener('click', () => {
  document.getElementById('winnerModal').hidden = true;
  if (pendingPick === null) return;
  questions[pendingPick].asked = true;
  save();
  showQuestion(pendingPick);
  pendingPick = null;
});

function showQuestion(i) {
  const q = questions[i];
  document.getElementById('qRound').textContent = q.round ? q.round : '';
  document.getElementById('qNumber').textContent = i + 1;
  document.getElementById('qTextEn').textContent = q.en;
  document.getElementById('qTextEn').hidden = !q.en;
  document.getElementById('qTextTe').textContent = q.te;
  document.getElementById('qTextTe').hidden = !q.te;
  document.querySelector('#display-screen .divider').hidden = !q.en || !q.te;

  const audio = document.getElementById('qAudio');
  if (q.audio) {
    audio.src = q.audio;
    audio.hidden = false;
    audio.play().catch(() => {});
  } else {
    audio.pause();
    audio.removeAttribute('src');
    audio.hidden = true;
  }

  document.getElementById('imageBlock').hidden = !q.image;
  document.getElementById('chooseAnotherBtn').hidden = !!q.image;
  if (q.image) startImageReveal(q.image);

  setupTimer(q.timer || 0);

  showScreen('display-screen');
}

let timerTotal = 0;
let timerRemaining = 0;
let timerInterval = null;

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
}

function setupTimer(seconds) {
  clearInterval(timerInterval);
  timerInterval = null;
  timerTotal = seconds;
  timerRemaining = seconds;
  document.getElementById('timerBlock').hidden = !seconds;
  const display = document.getElementById('timerDisplay');
  display.classList.remove('zero', 'flash');
  display.textContent = formatTime(timerRemaining);
  setToggleBtn(false);
}

function setToggleBtn(running) {
  const btn = document.getElementById('timerToggleBtn');
  btn.textContent = running ? '⏸' : '▶';
}

function tickTimer() {
  timerRemaining--;
  const display = document.getElementById('timerDisplay');
  display.textContent = formatTime(Math.max(timerRemaining, 0));
  if (timerRemaining <= 0) {
    clearInterval(timerInterval);
    timerInterval = null;
    setToggleBtn(false);
    display.classList.add('zero', 'flash');
    playTimerBeep();
  }
}

function runTimer() {
  if (timerInterval || timerRemaining <= 0) return;
  timerInterval = setInterval(tickTimer, 1000);
  setToggleBtn(true);
}

document.getElementById('timerToggleBtn').addEventListener('click', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
    setToggleBtn(false);
  } else {
    runTimer();
  }
});

// Web Audio beep — no external asset needed for the zero-time alert.
// Siren-style alarm: alternating-pitch beeps over ~3s, not one short blip.
function playTimerBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const beepCount = 8;
    const beepDur = 0.25;
    const gapDur = 0.12;
    let t = ctx.currentTime;
    for (let i = 0; i < beepCount; i++) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = i % 2 === 0 ? 1000 : 700;
      gain.gain.setValueAtTime(0.35, t);
      osc.start(t);
      osc.stop(t + beepDur);
      t += beepDur + gapDur;
    }
    setTimeout(() => ctx.close(), (t - ctx.currentTime + 0.5) * 1000);
  } catch (e) {}
}

document.getElementById('chooseAnotherBtn').addEventListener('click', () => {
  renderPicker();
  showScreen('picker-screen');
});

function startImageReveal(src) {
  imgStageIndex = 0;
  document.getElementById('qSpinner').hidden = false;
  currentImg = new Image();
  currentImg.onload = setupImgCanvas;
  currentImg.onerror = () => { document.getElementById('qSpinner').hidden = true; };
  currentImg.src = src;
}

function setupImgCanvas() {
  document.getElementById('qSpinner').hidden = true;
  const canvas = document.getElementById('qCanvas');
  const w = Math.min(IMG_CANVAS_MAX_W, currentImg.naturalWidth || IMG_CANVAS_MAX_W);
  const h = Math.round(w * ((currentImg.naturalHeight || w) / (currentImg.naturalWidth || w)));
  canvas.width = w;
  canvas.height = h;
  renderImageStage();
}

// Downscale to `blocks` px wide, then blow that back up with smoothing off —
// the mosaic/pixelate effect, more guessable early than a uniform blur.
function drawPixelated(canvas, img, blocks) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  if (blocks === null) {
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(img, 0, 0, w, h);
    return;
  }
  const smallW = blocks;
  const smallH = Math.max(1, Math.round(h * (blocks / w)));
  const off = document.createElement('canvas');
  off.width = smallW;
  off.height = smallH;
  const octx = off.getContext('2d');
  octx.imageSmoothingEnabled = true;
  octx.drawImage(img, 0, 0, smallW, smallH);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(off, 0, 0, smallW, smallH, 0, 0, w, h);
}

function renderImageStage() {
  const canvas = document.getElementById('qCanvas');
  const blocks = IMG_STAGES[imgStageIndex];
  drawPixelated(canvas, currentImg, blocks);
  const dots = document.getElementById('qStageDots');
  dots.innerHTML = IMG_STAGES.map((_, i) => `<span class="${i <= imgStageIndex ? 'done' : ''}"></span>`).join('');
  const revealed = blocks === null;
  document.getElementById('imgNextBtn').textContent = revealed ? 'Choose another →' : 'Next →';
}

document.getElementById('imgNextBtn').addEventListener('click', () => {
  if (imgStageIndex < IMG_STAGES.length - 1) {
    imgStageIndex++;
    renderImageStage();
  } else {
    renderPicker();
    showScreen('picker-screen');
  }
});

document.getElementById('fullscreenBtn').addEventListener('click', () => {
  if (document.fullscreenElement) {
    document.exitFullscreen();
  } else {
    document.documentElement.requestFullscreen().catch(() => {});
  }
});

document.querySelectorAll('.back').forEach(b => {
  b.addEventListener('click', () => {
    const target = b.dataset.go;
    if (target === 'picker-screen') renderPicker();
    showScreen(target);
  });
});

const roundSelect = document.getElementById('roundInput');
function updateAddSections() {
  const isMusic = roundSelect.value.includes('Music');
  const isPictorial = roundSelect.value.includes('Pictorial');
  document.getElementById('audioSection').hidden = !isMusic;
  document.getElementById('imageSection').hidden = !isPictorial;
  document.getElementById('textSection').hidden = isMusic || isPictorial;
}

// Switching rounds clears whatever's staged but not yet added, so a stale
// file selection or pasted text can't get attached to the wrong round.
function clearPendingInputs() {
  document.getElementById('bulkInput').value = '';
  document.getElementById('imageUrlInput').value = '';
  document.getElementById('audioInput').value = '';
  document.getElementById('imageInput').value = '';
}

let previousRound = roundSelect.value;
roundSelect.addEventListener('change', () => {
  if (questions.length && !confirm(`Switching rounds will clear all ${questions.length} current question(s). Continue?`)) {
    roundSelect.value = previousRound;
    return;
  }
  previousRound = roundSelect.value;
  clearPendingInputs();
  updateAddSections();
  questions = [];
  save();
  renderList();
});
updateAddSections();

renderList();
</script>
</body>
</html>
